# -------------------------------------------------------------------------------------------------
#  TestSingleMakerStrategy Configuration
#  Default parameters for benchmark testing
# -------------------------------------------------------------------------------------------------

strategy:
  # Strategy class (must match the Python class name)
  class_name: TestSingleMakerStrategy

  # Instrument to trade
  instrument_id: SOLUSDT-LINEAR.BYBIT

  # Spread around mid-price in basis points (10 bps = 0.1%)
  spread_bps: 10.0

  # Moving average window in minutes
  ma_window_minutes: 5

  # Price tolerance for re-quoting in basis points
  # Orders are updated when mid-price moves >= this threshold
  price_tolerance_bps: 15.0

  # Order size in base currency (SOL)
  order_size_base: 1.0

  # Maximum long position in base currency
  max_long_position: 5.0

  # Maximum short position magnitude in base currency
  max_short_position: 5.0

  # Maximum budget in quote currency (USDT)
  max_budget_quote: 5000.0

  # Order book type (L2_MBP for Level 2 Market By Price)
  book_type: L2_MBP

# Backtest configuration
backtest:
  # Starting balances
  starting_balances:
    USDT: 5000.0
    SOL: 0.0

  # Account type (CASH or MARGIN)
  account_type: MARGIN

  # OMS type (NETTING or HEDGING)
  oms_type: NETTING

  # Venue
  venue: BYBIT

  # Data path (adjust to your recorded data location)
  data_path: ../data/6hr/20251110-000802

  # Start and end times (will be auto-detected from data if not specified)
  # start_time: "2025-11-09T00:00:00Z"
  # end_time: "2025-11-09T06:00:00Z"

# Fill model configuration (optional)
fill_model:
  # Probability of limit order fill (0.0 to 1.0)
  # Set to 1.0 for aggressive fill model (fill whenever price crosses)
  prob_fill_on_limit: 1.0

  # Probability of stop order fill
  prob_fill_on_stop: 0.95

  # Probability of slippage
  prob_slippage: 0.0

  # Random seed for reproducibility
  random_seed: 42

# Latency model configuration (optional)
latency_model:
  # One-way latency in microseconds (5000 = 5ms)
  order_submit_latency_us: 5000
  order_response_latency_us: 5000

# Logging configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # Enable colored logs
  log_colors: true

  # Log strategy events
  log_events: true
